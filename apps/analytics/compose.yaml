services:
  mongo:
    image: mongo:8.0@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
    environment:
      MONGO_INITDB_ROOT_USERNAME: analytics_root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Definir secreto local}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Definir secreto local}
    volumes:
      - analytics_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/analytics.js:ro
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    cpus: 1
  api:
    build: .
    image: ${ANALYTICS_IMAGE:-greenalert-analytics:local}
    environment:
      ANALYTICS_INTERNAL_TOKEN: ${ANALYTICS_INTERNAL_TOKEN:?Definir secreto local}
      ANALYTICS_MONGO_URI: mongodb://analytics:${MONGO_APP_PASSWORD}@mongo:27017/greenalert_analytics?authSource=greenalert_analytics
      ANALYTICS_CPU_WORKERS: 2
      ANALYTICS_MAX_CPU_JOBS: 2
      ANALYTICS_COMPUTE_TIMEOUT_SECONDS: 30
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-8010}:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
    init: true
    mem_limit: 1536m
    cpus: 2
  tests:
    image: ${ANALYTICS_IMAGE:-greenalert-analytics:local}
    profiles: [test]
    environment:
      ANALYTICS_TEST_URL: http://api:8000
      ANALYTICS_INTERNAL_TOKEN: ${ANALYTICS_INTERNAL_TOKEN}
      ANALYTICS_MONGO_URI: mongodb://analytics:${MONGO_APP_PASSWORD}@mongo:27017/greenalert_analytics?authSource=greenalert_analytics
    volumes:
      - ../backend/tests/fixtures/zonas-riesgo:/fixtures:ro
    command: [python, -m, pytest, -v, -p, no:cacheprovider, tests]
    init: true
    mem_limit: 1536m
    cpus: 2
volumes:
  analytics_data:
