name: greenalert
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-green-alert}
      MYSQL_USER: ${MYSQL_USER:-greenalert}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Ejecuta npm run setup}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Ejecuta npm run setup}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./apps/backend/DATABASE_SCHEMA_COMPLETE.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1 FROM categorias_riesgo LIMIT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  backend-prod:
    build:
      context: ./apps/backend
    restart: unless-stopped
    env_file: ./apps/backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-greenalert}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Ejecuta npm run setup}
      DB_NAME: ${MYSQL_DATABASE:-green-alert}
      DB_SSL: "false"
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: /api
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-8080}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-8080},http://localhost:5173
      API_PUBLIC_URL: http://localhost:${FRONTEND_PORT:-8080}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: ./apps/frontend
      target: production
      args:
        VITE_APP_NAME: GreenAlert
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend-prod:
        condition: service_healthy
volumes:
  mysql_data:
  backend_uploads:
